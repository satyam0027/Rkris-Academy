<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circulars and Downloads | RKris Academy</title>
  <meta name="description" content="Download circulars, time tables, syllabus, holiday lists, date sheets and other school forms from RKris Academy.">
  <link rel="canonical" href="circulars.html">
  <meta property="og:title" content="Circulars and Downloads | RKris Academy">
  <meta property="og:description" content="School circulars, time tables, syllabus and forms for parents and students.">
  <meta property="og:image" content="assets/images/photo-assembly.jpg">
  <link rel="icon" href="assets/icons/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="circulars">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-banner">
      <div class="container">
        <nav aria-label="Breadcrumb"><ol class="breadcrumb"><li><a href="index.html">Home</a></li><li>Circulars</li></ol></nav>
        <h1>Circulars and downloads</h1>
        <p>Official downloads from the school, starting with the 2026-27 fee structure. Further circulars will be added as they are issued.</p>
      </div>
    </section>
    <section class="section">
      <div class="container" data-circulars>
        <div class="search">
          <label class="sr-only" for="circular-search">Search circulars</label>
          <input class="form__control" id="circular-search" type="search" placeholder="Search by title or class">
        </div>
        <div class="tabs" role="tablist" aria-label="Document type">
          <button type="button" class="tabs__btn is-active" data-circ-tab="circulars" aria-selected="true">Circulars</button>
          <button type="button" class="tabs__btn" data-circ-tab="timetable" aria-selected="false">Time Table</button>
          <button type="button" class="tabs__btn" data-circ-tab="syllabus" aria-selected="false">Syllabus</button>
          <button type="button" class="tabs__btn" data-circ-tab="holiday" aria-selected="false">Holiday List</button>
          <button type="button" class="tabs__btn" data-circ-tab="datesheet" aria-selected="false">Date Sheets</button>
          <button type="button" class="tabs__btn" data-circ-tab="forms" aria-selected="false">Other Forms</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Date</th>
                <th>Class / category</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody data-circ-body></tbody>
          </table>
        </div>
        <div class="pagination">
          <button type="button" class="btn btn--outline" data-load-more>Load more</button>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js" defer></script>
  <script src="js/includes.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/circulars.js" defer></script>
  <script src="js/forms.js" defer></script>
</body>
</html>
